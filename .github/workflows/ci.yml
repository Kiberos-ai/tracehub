name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bunfig.toml maps the @context777 scope to npm.muid.io, which serves
      # reads anonymously; the committed lockfile pins what production runs.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # The repository also ships a small Python client (src/tracehub). It had
      # no tests until 2026-08-29 and drifted unnoticed: the version was
      # declared in two places that disagreed, and the retired Python server
      # rode inside the client wheel importing a dependency never declared.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the Python client
        run: |
          python -m pip install --quiet pytest httpx
          python -m pytest -q
