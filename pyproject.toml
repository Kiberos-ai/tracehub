[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracehub"
version = "0.1.0"
description = "Python client for TraceHub — send checkpoint traces to a TraceHub server"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "LifeAiTools Dev Team", email = "dev@lifeaitools.com"}
]
keywords = [
    "tracing",
    "distributed-tracing",
    "checkpoint",
    "debugging",
    "observability",
    "correlation-id",
    "microservices",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Logging",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

# No server extra: the TraceHub server is TypeScript (Bun + Hono) since 812da1e.
# This package is the Python client only.

[project.urls]
Homepage = "https://muid.io"
Repository = "https://github.com/Kiberos-ai/tracehub"

[tool.hatch.build.targets.wheel]
packages = ["src/tracehub"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
exclude = [
    "/.claude",
    "/.env",
    "/tests",
    "*.toc",
    "__pycache__",
    "*.pyc",
]
