services:
  tracehub:
    build: .
    container_name: tracehub
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      - TRACEHUB_PORT=8099
      - TRACEHUB_DB=/data/tracehub.db
      - TRACEHUB_RETENTION_HOURS=24
      - TRACEHUB_SECRET=${TRACEHUB_SECRET}
      - MAX_LONGPOLL_CONNECTIONS=${MAX_LONGPOLL_CONNECTIONS:-200}
      - TRACEHUB_RATE_INGEST=${TRACEHUB_RATE_INGEST:-120}
      - TRACEHUB_RATE_CONFIG=${TRACEHUB_RATE_CONFIG:-10}
      - TRACEHUB_RATE_QUERY=${TRACEHUB_RATE_QUERY:-60}
      - TRACEHUB_BAN_WARNING=${TRACEHUB_BAN_WARNING:-60}
      - TRACEHUB_BAN_HARD=${TRACEHUB_BAN_HARD:-300}
      # Docs provider — registers TracHub's own docs with the context777 index.
      # Without CENTRAL_URL the provider still serves /help/api but never registers.
      - TRACEHUB_DOCS_CENTRAL_URL=${TRACEHUB_DOCS_CENTRAL_URL:-https://context777.com}
      - TRACEHUB_DOCS_SOURCE_SECRET=${TRACEHUB_DOCS_SOURCE_SECRET}
      - TRACEHUB_DOCS_PROVIDER_URL=${TRACEHUB_DOCS_PROVIDER_URL:-https://tracehub.muid.io/help/api}
    volumes:
      - tracehub_data:/data
      # Hot-swap code mount (no rebuild needed, just restart)
      - /opt/tracehub/src:/app/src:ro
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.tracehub.rule=Host(`tracehub.muid.io`)"
      - "traefik.http.routers.tracehub.entrypoints=websecure"
      - "traefik.http.routers.tracehub.tls.certresolver=letsencrypt"
      - "traefik.http.services.tracehub.loadbalancer.server.port=8099"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8099/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tracehub_data:
    driver: local

networks:
  web:
    external: true
